# 英语词典录音：Kokoro-82M（Apache 2.0），声音 af_heart（和网站英语单词同一个声音）。在 Actions 页面手动运行（公开仓库，不需要任何 Secret）。
# 词表 lang/en-dict.json 从公开仓库 koshokai/nihonggo-dojo 取；已经有录音的词（nihonggo-dojo-audio 的 index-en.json、index-en-human.json）不再生成。
# 安装步骤和 nihonggo-dojo-audio 的 kokoro.yml 一样。
# 分 8 片并行；每片到时间（max_minutes）会自己停下并上传已完成的部分，最后一个任务合并、提交。没做完就再运行一次，会接着做。
# 日志只打印数量。
name: Dictionary audio - English (Kokoro)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 从 koshokai/nihonggo-dojo 的哪个分支取 lang/en-dict.json
        required: false
        default: main
      limit:
        description: 每片最多生成多少个（0 = 全部；试跑时填 5）
        required: false
        default: '0'
      max_minutes:
        description: 每片最多生成多少分钟（之后上传、合并；GitHub 一个任务最多 6 小时）
        required: false
        default: '300'

permissions:
  contents: write

concurrency:
  group: dict-audio-en
  cancel-in-progress: false

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      # 只检出脚本和索引（不下载录音本身）；已有的录音文件列表用 git ls-tree 取
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /scripts/
            /index-dict-*.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kokoro
        timeout-minutes: 20
        run: |
          sudo apt-get update -q && sudo apt-get install -yq espeak-ng ffmpeg
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9" soundfile numpy
          git ls-tree -r --name-only HEAD -- en-d > "$RUNNER_TEMP/have.txt"
          wc -l < "$RUNNER_TEMP/have.txt"
      - name: Generate
        timeout-minutes: 320
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 8
          SRC_REF: ${{ inputs.ref }}
          MAX_MINUTES: ${{ inputs.max_minutes }}
          OUT_DIR: ${{ runner.temp }}/out
          HAVE_FILES: ${{ runner.temp }}/have.txt
          LIMIT: ${{ inputs.limit }}
        run: |
          python scripts/gen_en.py --limit "${LIMIT:-0}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: en-${{ matrix.shard }}
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore
          retention-days: 3

  commit:
    needs: gen
    if: always() && needs.gen.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true   # 所有分片都没有结果时不算失败（下面会打印 0）
        with:
          pattern: en-*
          path: ${{ runner.temp }}/art
      - name: Merge and commit
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/art"
          echo "shards with results: $(ls "$RUNNER_TEMP/art" | wc -l)"
          python3 scripts/merge.py en "$RUNNER_TEMP/art"
          git config user.name "dict-audio-bot"
          git config user.email "dict-audio-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "audio: English dictionary words (Kokoro af_heart)"
          for i in 1 2 3 4 5; do git pull -q --rebase origin "$BRANCH" && git push -q origin "HEAD:$BRANCH" && exit 0; sleep $((i * 10)); done
          exit 1
